<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Light Computer Services - a laptop repair shop game. Made by AFGame.">
<title>Light Computer Services</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&family=Libre+Baskerville:wght@700&display=swap">
<style>
/* Layout: one-screen workshop app — HUD on top, scrolling work area, tab bar at the bottom. Night shop, ESD-blue bench mat, amber sign light. */
:root{
  --ink:#0e1317;--panel:#172028;--panel2:#1e2a33;--line:#2b3a45;--fg:#e6ecef;--dim:#8d9ca7;
  --amber:#f3a83b;--amber-ink:#2a1a03;--mat:#1d5872;--mat2:#174a60;--pcb:#16603f;--pcb2:#1b7a4f;--copper:#c9773d;
  --ok:#4fd18b;--warn:#f2c94c;--bad:#ff6161;--paper:#fbf8ef;--paper-ink:#23211c;
  --f-disp:"Chakra Petch","Segoe UI",system-ui,sans-serif;--f-body:"Barlow","Segoe UI",system-ui,sans-serif;--f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*,*:before,*:after{box-sizing:border-box}
html,body{height:100%;background:var(--ink);color:var(--fg)}
body{font-family:var(--f-body);font-size:15px;line-height:1.4;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column}
.wrap{width:100%;max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* title */
#title{position:fixed;inset:0;z-index:50;background:#070a0f;display:flex;flex-direction:column}
#introCv{position:absolute;inset:0;width:100%;height:100%;display:block}
#titleUi{position:relative;margin-top:auto;padding-block:24px calc(28px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,#070a0fee 30%);opacity:0;transition:opacity .8s}
#titleUi.show{opacity:1}
.gname{font-family:var(--f-disp);font-weight:700;font-size:clamp(30px,7.4vw,62px);letter-spacing:.04em;line-height:1;color:var(--amber);text-shadow:0 0 18px #f3a83b66}
.gname small{display:block;font-size:.36em;letter-spacing:.32em;color:#ffd79a;margin-top:6px}
.gsub{color:var(--dim);margin-top:8px;max-width:52ch}
.trow{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.tin{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;color:var(--fg);font:inherit;min-width:0;flex:1 1 220px}
.langs{display:flex;gap:6px;margin-top:12px}

/* buttons */
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-weight:600;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:hover{border-color:var(--dim)}
.btn.pri{background:var(--amber);color:var(--amber-ink);border-color:var(--amber)}
.btn.bad{background:#3a1717;border-color:#6b2a2a;color:#ffd0d0}
.btn.sm{padding:7px 10px;font-size:13px}
.btn.on{background:var(--fg);color:var(--ink)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px}

/* HUD */
.hud{border-bottom:1px solid var(--line);background:var(--panel);padding-top:env(safe-area-inset-top,0px)}
.hud .wrap{display:flex;align-items:center;gap:10px;padding-block:8px}
.sign{font-family:var(--f-disp);font-weight:700;color:var(--amber);letter-spacing:.05em;text-transform:uppercase;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw;text-shadow:0 0 10px #f3a83b55}
.stat{display:flex;gap:10px;margin-left:auto;font-variant-numeric:tabular-nums;font-size:13px;align-items:center}
.stat>*{white-space:nowrap}
.stat b{font-family:var(--f-mono);font-weight:700}
.stars{color:var(--amber)}
.ibtn{background:none;border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:12px;color:var(--dim)}

main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
main .wrap{padding-block:14px 150px}
nav.tabs{border-top:1px solid var(--line);background:var(--panel);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding-block:6px}
nav.tabs button{background:none;border:0;border-radius:8px;padding:8px 2px;color:var(--dim);font-weight:600;font-size:13px;position:relative;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7}
nav.tabs button.on{color:var(--amber);background:#f3a83b14}
.badge{position:absolute;top:2px;right:calc(50% - 22px);background:var(--bad);color:#fff;border-radius:9px;font-size:11px;min-width:18px;padding:0 5px;line-height:18px}
.badge.g{background:var(--ok);color:#06210f}

h2{font-family:var(--f-disp);font-size:20px;letter-spacing:.03em;margin-bottom:10px;text-wrap:balance}
h3{font-family:var(--f-disp);font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin:18px 0 8px}
.dim{color:var(--dim)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
.chip{display:inline-block;font-size:12px;padding:2px 8px;border-radius:20px;background:var(--panel2);border:1px solid var(--line);color:var(--dim)}
.chip.ok{color:var(--ok);border-color:#2e6b4a}.chip.warn{color:var(--warn);border-color:#6b5a22}.chip.bad{color:var(--bad);border-color:#6b2a2a}
.mono{font-family:var(--f-mono)}

/* counter scene */
.scene{position:relative;height:210px;border-radius:12px;overflow:hidden;background:linear-gradient(#2a2117 0 62%,#3b2c1c 62% 66%,#5a3f24 66% 100%);border:1px solid var(--line)}
.scene.lit{background:linear-gradient(#3a2b18 0 62%,#4b3620 62% 66%,#6a4a2a 66% 100%)}
.scene .win{position:absolute;left:5%;top:9%;width:28%;height:40%;background:linear-gradient(#1c2a3a,#26384a);border:4px solid #3b2c1c;border-radius:4px}
.scene .neon{position:absolute;left:5%;top:2%;font:700 12px var(--f-disp);color:#7af0ff;text-shadow:0 0 8px #7af0ff,0 0 16px #2ab7d4;letter-spacing:.12em}
.scene .poster{position:absolute;right:6%;top:6%;width:20%;height:30%;background:#efe2c4;border-radius:2px;color:#3b2c1c;font:700 9px/1.2 var(--f-disp);padding:6px;transform:rotate(2deg);overflow:hidden}
.scene .vitrin{position:absolute;left:5%;top:9%;width:28%;height:40%;background-color:#1c2a3a;grid-template-columns:repeat(4,1fr)!important;border:3px solid #6b4a2a;border-radius:3px;background:#ffffff0c;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:5px;align-content:end}
.scene .vitrin i{height:14px;border-radius:2px}
.cust{position:absolute;left:50%;bottom:34%;transform:translateX(-50%);width:90px;height:120px;animation:walkin .6s ease-out}
.cust .head{position:absolute;left:28px;top:0;width:34px;height:38px;border-radius:50% 50% 46% 46%;background:#d9a77c}
.cust .hair{position:absolute;left:25px;top:-4px;width:40px;height:20px;border-radius:20px 20px 6px 6px}
.cust .body{position:absolute;left:10px;top:40px;width:70px;height:80px;border-radius:30px 30px 6px 6px}
.scene .counterTop{position:absolute;left:0;right:0;bottom:22%;height:14%;background:#6b4a2a;border-top:3px solid #8a6238}
.scene .lapOn{position:absolute;left:62%;bottom:36%;width:64px;height:9px;border-radius:2px 2px 0 0}
.register{position:absolute;right:5%;bottom:36%;width:74px;height:46px}
.register .rb{position:absolute;left:0;right:0;bottom:0;height:30px;background:linear-gradient(#3c454c,#262c31);border-radius:4px 4px 2px 2px}
.register .rd{position:absolute;left:8px;top:0;width:40px;height:18px;background:#0b1a12;border:2px solid #3c454c;border-radius:3px;color:#5dff9a;font:700 9px/14px var(--f-mono);text-align:center;overflow:hidden}
.register .dr{position:absolute;left:4px;right:4px;bottom:-6px;height:10px;background:#555f66;border-radius:0 0 3px 3px;transition:transform .35s cubic-bezier(.3,1.6,.6,1)}
.register.open .dr{transform:translateY(12px)}
.bubble{position:relative;background:var(--fg);color:#16202a;border-radius:12px;padding:12px 14px;margin-top:12px;font-size:16px}
.bubble:before{content:"";position:absolute;left:30px;top:-10px;border:10px solid transparent;border-top:0;border-bottom-color:var(--fg)}
@keyframes walkin{from{transform:translateX(30%);opacity:0}to{transform:translateX(-50%);opacity:1}}

.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.job .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.job .say{font-size:14px;color:var(--dim);margin:6px 0 10px}

/* bench */
.mat{background:repeating-linear-gradient(0deg,transparent 0 39px,#ffffff0d 39px 40px),repeating-linear-gradient(90deg,transparent 0 39px,#ffffff0d 39px 40px),linear-gradient(var(--mat),var(--mat2));border-radius:14px;padding:16px;border:1px solid #2b6b88;position:relative}
.jobbar{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px}
.jobbar .who{min-width:0;flex:1 1 240px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:var(--panel);border:0;padding:8px 14px;font-weight:600;color:var(--dim)}
.seg button.on{background:var(--fg);color:var(--ink)}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.notes{margin-top:12px;font-size:13px;color:#cfe4ee;display:grid;gap:4px}
.notes div{background:#0b2a38aa;border-radius:6px;padding:6px 8px}

/* laptop front */
.lapF{position:relative;margin:0 auto}
.lid{background:var(--lid);border-radius:12px 12px 2px 2px;padding:3.2% 3.2% 4%;border:1px solid #ffffff1a;position:relative}
.lid .stripe{position:absolute;left:30%;right:30%;bottom:1.2%;height:3px;border-radius:2px}
.scr{position:relative;aspect-ratio:16/10;background:#05070a;border-radius:3px;overflow:hidden;font-family:var(--f-mono);font-size:clamp(9px,2.3vw,13px);color:#d8dde0}
.scr .refl{position:absolute;inset:0;background:linear-gradient(120deg,#ffffff10,transparent 40%);pointer-events:none}
.deck{position:relative;background:linear-gradient(var(--deck1),var(--deck2));height:clamp(70px,20vw,110px);border-radius:0 0 14px 14px;margin:0 -3%;clip-path:polygon(2% 0,98% 0,100% 100%,0 100%)}
.kbd{position:absolute;left:12%;right:12%;top:10%;height:44%;border-radius:3px;background:repeating-linear-gradient(90deg,transparent 0 6%,var(--deck2) 6% 6.9%),repeating-linear-gradient(0deg,var(--deck2) 0 3.5%,transparent 3.5% 20%),var(--key);box-shadow:inset 0 0 0 2px var(--deck2),0 1px 0 #ffffff22}
.kbd.glow{box-shadow:0 0 14px var(--glow)}
.tpad{position:absolute;left:38%;width:24%;top:60%;height:30%;background:#00000022;border-radius:4px;border:1px solid #00000033;transition:transform .3s}
.tpad.raised{transform:translateY(-4px) rotate(-2deg);box-shadow:0 6px 0 #00000066}
.pwr{position:absolute;right:5%;top:10%;width:22px;height:22px;border-radius:50%;background:#3a4148;border:2px solid #59626a}
.pwr:after{content:"";position:absolute;left:50%;top:22%;width:2px;height:40%;background:#9aa3aa;transform:translateX(-50%)}
.leds{position:absolute;left:4%;bottom:12%;display:flex;gap:6px}
.led{width:8px;height:8px;border-radius:50%;background:#4b5359;display:block}
.led.on{background:#e8f6ff;box-shadow:0 0 8px #bfe6ff}
.led.amber{background:var(--amber);box-shadow:0 0 8px var(--amber)}
.led.blink{background:var(--amber);animation:blink .5s steps(2) infinite}
.led.flick{background:var(--amber);animation:blink .23s steps(2) infinite}
@keyframes blink{50%{opacity:.1}}
.cable{position:absolute;left:3%;bottom:-14px;width:34%;height:6px;background:#1a1d20;border-radius:3px}
.cable:after{content:attr(data-l);position:absolute;left:0;top:9px;font-size:11px;color:var(--fg);white-space:nowrap}
.cable.test{background:#7a1f1f}

/* screens */
.s-text{position:absolute;inset:0;padding:6%;white-space:pre-wrap;line-height:1.5}
.s-post{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.s-post .f2{position:absolute;left:4%;bottom:5%;font-size:.75em;color:#888}
.bl{font-weight:700;letter-spacing:.14em;font-size:clamp(16px,5vw,30px)}
.b-lenvo .bl{font-family:var(--f-body);color:#fff;letter-spacing:.06em;font-size:clamp(18px,5.4vw,32px);padding:2px 10px;border-bottom:4px solid #e2231a;animation:fadein 1s}
.b-aser .bl{font-family:var(--f-disp);color:#83b81a;text-transform:lowercase;letter-spacing:.02em;font-size:clamp(20px,6vw,36px);animation:slidein .9s cubic-bezier(.2,.8,.2,1)}
.b-hb .bl{width:2.4em;height:2.4em;border-radius:50%;border:3px solid #2aa0ff;display:grid;place-items:center;color:#2aa0ff;font-style:italic;font-family:var(--f-body);letter-spacing:0;animation:pulse2 1.2s ease-in-out infinite}
.b-dalle .bl{width:3.4em;height:3.4em;border-radius:50%;border:3px solid #3f8fe0;display:grid;place-items:center;color:#3f8fe0;font-size:clamp(11px,3vw,18px);letter-spacing:.05em}
.b-dalle .bar{width:40%;height:4px;background:#222;margin:10px auto 0;border-radius:2px;overflow:hidden}
.b-dalle .bar i{display:block;height:100%;background:#3f8fe0;animation:fill 1.2s linear forwards}
.b-canavar .bl{color:#ff2b2b;font-family:var(--f-disp);text-shadow:2px 0 #00e5ff,-2px 0 #ff2b2b;animation:glitch .35s steps(2) infinite}
.b-canavar{background:repeating-linear-gradient(0deg,#ff2b2b0d 0 2px,transparent 2px 4px)}
.b-tosiba .bl{color:#e2231a;font-family:"Libre Baskerville",Georgia,serif;letter-spacing:.06em}
.b-tosiba .sub{color:#999;font-size:.7em;margin-top:6px;animation:blink 1s steps(2) infinite}
.dots{display:flex;gap:6px;justify-content:center;margin-top:12px}.dots i{width:6px;height:6px;border-radius:50%;background:#ccc;animation:dot 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{50%{opacity:.15}}
@keyframes fadein{from{opacity:0}}
@keyframes slidein{from{transform:translateX(-40%);opacity:0}}
@keyframes pulse2{50%{transform:scale(1.08);box-shadow:0 0 16px #2aa0ff88}}
@keyframes fill{from{width:0}to{width:100%}}
@keyframes glitch{50%{transform:translateX(2px) skewX(-6deg)}}
.s-bios{position:absolute;inset:0;background:#0f2a6b;color:#e5ecff;padding:4% 5%;line-height:1.5}
.s-bios h4{background:#b9c4e0;color:#0f2a6b;margin:-4% -5% 3%;padding:1.5% 5%;font-size:1em}
.s-bios table{width:100%;border-collapse:collapse}.s-bios td{padding:0 4px 0 0;vertical-align:top}
.s-bios .w{color:#ffd76b}
.s-bsod{position:absolute;inset:0;background:#1b6ac9;color:#fff;padding:7%;font-family:var(--f-body)}
.s-bsod b{font-size:2.6em;display:block;line-height:1}
.s-win{position:absolute;inset:0;font-family:var(--f-body)}
.s-win .icons{display:grid;grid-template-columns:repeat(4,1fr);gap:4%;padding:4% 5%}
.s-win .icons button{background:#ffffff14;border:1px solid #ffffff22;border-radius:6px;padding:6% 2%;color:#fff;font-size:.95em;line-height:1.15}
.s-win .bar{position:absolute;left:0;right:0;bottom:0;height:9%;background:#0c1a26e6;display:flex;align-items:center;justify-content:space-between;padding:0 3%;font-size:.85em}
.s-win .wnd{position:absolute;left:3%;right:3%;top:4%;bottom:12%;background:#f1f4f6;color:#16202a;border-radius:6px;overflow:hidden;display:flex;flex-direction:column}
.wnd .wt{background:#d9e0e5;display:flex;justify-content:space-between;align-items:center;padding:1% 2.5%;font-weight:700}
.wnd .wt button{background:none;border:0;font-weight:700;padding:0 6px}
.wnd .wb{padding:2.5% 3.5%;overflow:auto;flex:1;font-size:.95em;line-height:1.45}
.meter{height:10px;background:#cdd6dc;border-radius:5px;overflow:hidden;margin:4px 0}
.meter i{display:block;height:100%;background:#2f8f5b}
.kgrid{display:grid;grid-template-columns:repeat(12,1fr);gap:2px}.kgrid span{background:#cfd8de;border-radius:2px;font-size:.7em;text-align:center}
.kgrid span.x{background:#ff8b8b}
.s-menu{position:absolute;inset:0;background:#000;padding:6%;color:#ccc}
.s-menu button{display:block;width:100%;text-align:left;background:none;border:0;color:#ddd;padding:1.2% 2%;font-family:var(--f-mono);font-size:1em}
.s-menu button:hover,.s-menu button:focus{background:#d8dde0;color:#000}

/* underside */
.under{position:relative;margin:0 auto}
.cover{position:absolute;inset:0;background:linear-gradient(160deg,var(--c1),var(--c2));border-radius:var(--rad,16px);border:1px solid #ffffff22;box-shadow:inset 0 0 0 6px #00000022}
.vent{position:absolute;background:repeating-linear-gradient(90deg,#0e1114 0 4px,transparent 4px 9px);border-radius:6px;opacity:.85}
.vent.hc{background:radial-gradient(circle,#0e1114 0 45%,transparent 50%) 0 0/9px 9px}
.vent.red{background:repeating-linear-gradient(90deg,#3a0b0b 0 4px,transparent 4px 9px);box-shadow:0 0 0 1px #d22c2c55}
.sticker{position:absolute;left:40%;top:56%;width:22%;height:18%;background:#e9e4d6;color:#333;border-radius:3px;font:600 clamp(6px,1.5vw,9px)/1.25 var(--f-mono);padding:1%;overflow:hidden}
.foot{position:absolute;width:13%;height:6%;background:#15191c;border-radius:20px;transform:translate(-50%,-50%);border:0}
.foot.strip{width:4%;height:30%}
.scrw{position:absolute;width:clamp(16px,3.6%,24px);aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);border:0;padding:0;background:radial-gradient(circle at 40% 35%,#cfd6db,#7d878f 60%,#4c555c)}
.scrw:before,.scrw:after{content:"";position:absolute;left:50%;top:50%;width:56%;height:2px;background:#30373d;transform:translate(-50%,-50%)}
.scrw:after{transform:translate(-50%,-50%) rotate(90deg)}
.scrw.torx:after{transform:translate(-50%,-50%) rotate(60deg)}
.scrw.out{background:#0c0f12;box-shadow:inset 0 0 0 2px #4a545c}
.scrw.out:before,.scrw.out:after{display:none}
.scrw.spin{animation:unscrew .35s ease-in}
@keyframes unscrew{to{transform:translate(-50%,-50%) rotate(-540deg) scale(1.25)}}

/* board */
.board{position:absolute;inset:0;border-radius:var(--rad,16px);overflow:hidden;background:repeating-linear-gradient(90deg,transparent 0 22px,#ffffff08 22px 23px),repeating-linear-gradient(0deg,transparent 0 30px,#ffffff06 30px 31px),#262d33;border:1px solid #4a545c}
.mb{position:absolute;left:3%;top:3%;width:94%;height:56%;background:linear-gradient(135deg,var(--pcbA,var(--pcb)),var(--pcbB,var(--pcb2)));border-radius:6px;box-shadow:inset 0 0 0 1px #00000055}
.cp{position:absolute;border:0;padding:0;background:none;border-radius:6px}
.cp:hover{outline:2px dashed #ffffffaa;outline-offset:2px}
.cp .lbl{position:absolute;left:50%;bottom:-2px;transform:translate(-50%,100%);font:600 clamp(8px,1.8vw,11px)/1 var(--f-body);background:#0a0f13cc;color:#fff;padding:2px 5px;border-radius:4px;white-space:nowrap;pointer-events:none;z-index:3}
.nolbl .cp .lbl{display:none}
.fanC{position:absolute;inset:4%;border-radius:50%;background:#1a1f23;border:3px solid #39424a;display:grid;place-items:center}
.blades{width:84%;height:84%;border-radius:50%;background:repeating-conic-gradient(#4d575f 0 18deg,#20262b 18deg 36deg)}
.blades.run{animation:spin .25s linear infinite}
.blades.slow{animation:spin 1.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.dust{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 30% 30%,#a59f92 0 18%,transparent 19%),radial-gradient(circle at 70% 60%,#b6ae9f 0 22%,transparent 23%),radial-gradient(circle,#8c877c 0 70%,transparent 72%);pointer-events:none}
.hsink{position:absolute;inset:0}
.hsink .pipe{position:absolute;left:-30%;top:40%;width:100%;height:16%;background:linear-gradient(var(--copper),#8f4f22);border-radius:8px}
.hsink .plate{position:absolute;left:50%;top:10%;width:44%;height:80%;background:linear-gradient(135deg,#d7dde1,#9aa4ab);border-radius:4px;box-shadow:0 0 0 2px #6b747b}
.hsink .plate i{position:absolute;width:12%;aspect-ratio:1;border-radius:50%;background:#59626a}
.cpu{position:absolute;left:50%;top:14%;width:40%;height:72%;background:#1e2a24;border-radius:3px;box-shadow:0 0 0 2px #2e3a33}
.cpu .die{position:absolute;inset:22% 22%;border-radius:2px;background:linear-gradient(135deg,#c9d0d6,#88939b)}
.cpu .paste{position:absolute;inset:16%;border-radius:4px}

const FAULTS={
  overheat:{day:1,w:3,labor:()=>20,setup:l=>{l.st.fan.dust=R(.82,.95);l.st.paste='dry';},
    say:[B('Oyun açınca 10-15 dakika sonra kendiliğinden kapanıyor. Fan da uçak gibi bağırıyor.','It shuts down on its own 10-15 minutes into a game. The fan screams like a jet.'),B('Çok ısınıyor, avucum yanıyor. Bir süre sonra pat diye kapanıyor.','It gets so hot my palms burn. Then it just switches off.')],
    hint:[B('Önce arızayı kendin gör: Windows\'ta Stres Testi\'ni çalıştır ve sıcaklığı izle.','See the fault yourself first: run the Stress Test in Windows and watch the temperature.'),B('Fanı temizle, soğutucuyu sök, eski macunu izopropille sil, yeni macun sür.','Clean the fan, remove the heatsink, wipe the old paste with isopropyl and apply fresh paste.')],
    lesson:B('İşlemci 95-100°C\'ye ulaşınca kendini korumak için sistemi kapatır (termal kapanma). Toz fanın hava kanalını tıkar, kuruyan termal macun ısıyı soğutucuya iletemez. Bakım: fan temizliği ve macun yenileme, çoğu laptopta 2-3 yılda bir.','At 95-100°C the CPU shuts the system down to protect itself (thermal shutdown). Dust clogs the fan\'s airflow and dried thermal paste stops conducting heat to the heatsink. The fix is a fan clean and fresh paste, usually every 2-3 years.')},
  fan_dead:{day:2,w:2,labor:()=>9,setup:l=>{l.st.fan.ok=false;l.st.fan.dust=R(.3,.5);},
    say:[B('Fan bir süre hırıldadı, şimdi hiç ses gelmiyor. Biraz kullanınca kapanıyor.','The fan grumbled for a while, now it\'s silent. It shuts off after a bit of use.'),B('Bilgisayar sessizleşti ama çok ısınıyor, sonra kapanıyor.','It went quiet but it runs very hot, then switches off.')],
    hint:[B('Alt kapak açıkken bilgisayarı çalıştır ve fanı izle. Stres testi de ipucu verir.','Power it on with the cover off and watch the fan. The stress test helps too.'),B('Fanı değiştir (modele özel fan siparişi gerekir).','Replace the fan (order the model-specific part).')],
    lesson:B('Fan rulmanı aşınınca önce hırıltı yapar, sonra durur. Fan dönmezse soğutucu ısıyı atamaz. Tozu alınsa da bozuk fan düzelmez; değiştirilir.','A worn fan bearing grinds first, then stops. With no airflow the heatsink can\'t shed heat. Cleaning won\'t fix a dead fan; it gets replaced.')},
  charger:{day:2,w:2,labor:()=>4,setup:l=>{l.charger.ok=false;l.st.bat.charge=0;},
    say:[B('Şarj aletini takıyorum, ışık yanmıyor. Pil de bitti, hiç açılmıyor.','I plug the charger in and no light comes on. The battery\'s dead and it won\'t start.'),B('Dün akşamdan beri şarj olmuyor, şimdi tamamen öldü.','It stopped charging last night and now it\'s completely dead.')],
    hint:[B('Adaptörü multimetreyle ölç. 19 V civarı olmalı.','Measure the charger with the multimeter. It should read about 19 V.'),B('Müşteriye modeline uygun yeni adaptör ver.','Give the customer a new charger that fits the model.')],
    lesson:B('"Açılmıyor" denen laptopların önemli kısmı aslında adaptör arızasıdır. Çıkış, etiketteki voltajın %10-15 yakınında olmalı. Önce en basit ve ucuz olanı ölç.','Many "won\'t turn on" laptops just have a dead charger. Output should be within 10-15% of the label voltage. Measure the simplest, cheapest thing first.')},
  bat_worn:{day:2,w:2,labor:()=>7,setup:l=>{l.st.bat.health=RI(30,42);},
    say:[B('Prizden çekince 10 dakikada kapanıyor. Eskiden 4 saat giderdi.','Off the charger it dies in 10 minutes. It used to last 4 hours.'),B('Şarj %100 diyor, prizden çekince birden %10\'a düşüp kapanıyor.','It says 100%, then drops to 10% and dies when I unplug it.')],
    hint:[B('BIOS\'ta (F2) ya da Windows\'ta Pil Raporu\'nda batarya sağlığına bak. Çalışırken adaptörü çekmeyi de dene.','Check battery health in the BIOS (F2) or the Battery Report in Windows. Try unplugging the charger while it runs.'),B('Bataryayı değiştir: önce konnektörü ayır, vidalarını sök.','Replace the battery: disconnect it first, then unscrew it.')],
    lesson:B('Lityum bataryalar şarj döngüsüyle kapasite kaybeder. Tam şarj kapasitesi tasarım kapasitesinin %60\'ının altına inince değişim önerilir. Windows\'ta "powercfg /batteryreport" bu raporu verir.','Lithium batteries lose capacity with every cycle. Below 60% of design capacity, replacement is recommended. On Windows, "powercfg /batteryreport" produces this report.')},
  bat_swollen:{day:3,w:1,labor:()=>7,setup:l=>{l.st.bat.swollen=true;l.st.bat.health=RI(15,30);},
    say:[B('Touchpad yukarı kalktı, tıklamıyor. Alt kapak da sanki şişti.','The touchpad lifted up and won\'t click. The bottom cover looks swollen too.'),B('Masaya koyunca sallanıyor, touchpad kabarmış.','It wobbles on the desk and the touchpad is bulging.')],
    hint:[B('Alt kapağı aç ve bataryaya bak. Kabarık touchpad genelde altında şişen bataryadan olur.','Open the cover and look at the battery. A raised touchpad usually means a swollen battery beneath it.'),B('Şişmiş bataryayı bükmeden, delmeden çıkar ve yenisini tak. Acil iş!','Remove the swollen battery without bending or puncturing it, and fit a new one. Urgent!')],
    lesson:B('Şişmiş lityum batarya tehlikelidir: delinirse alev alabilir. Bükmeden söker, ateşe dayanıklı kapta bekletir ve geri dönüşüme verirsin.','A swollen lithium battery is dangerous: punctured, it can catch fire. Remove it without bending, keep it in a fire-safe container and recycle it.')},
  ram_loose:{day:1,w:3,labor:()=>9,setup:l=>{l.st.ram.forEach(r=>{if(r)r.seated=false;});},
    say:[B('Çantadan düşürdüm. Açılıyor, fan dönüyor ama ekran siyah, bip bip ses var.','I dropped it. It powers on and the fan spins, but the screen stays black and it beeps.'),B('Düşürdükten sonra ekran gelmiyor, ışıklar yanıyor ama.','Since I dropped it, no picture. The lights still come on though.')],
    hint:[B('Aç ve dinle: fan dönüp ekran siyahsa ve bip varsa bellek şüphelisi. Kapağı açıp RAM\'e bak.','Power on and listen: fan spinning, black screen and beeps point to memory. Open it and look at the RAM.'),B('RAM\'i yerine "klik" sesi gelene kadar oturt.','Reseat the RAM until the latches click.')],
    lesson:B('Bip kodları anakartın tek dili. Görüntü yok + bip çoğu zaman RAM\'in yerinden oynadığını gösterir. Darbe sonrası RAM ve disk bağlantılarını kontrol et.','Beep codes are the motherboard\'s only language. No picture plus beeps usually means the RAM came loose. After a drop, check RAM and drive connections.')},
  ram_bad:{day:2,w:2,labor:()=>8,setup:l=>{const M=MODELS[l.model];if(!l.st.ram[1]&&M.slots>1)l.st.ram[1]={pid:M.initRam[0],ok:true,seated:true,owner:'cust'};const i=l.st.ram[1]?1:0;l.st.ram[i].ok=false;},
    say:[B('Sürekli mavi ekran veriyor, MEMORY_MANAGEMENT gibi bir şey yazıyor.','It keeps blue-screening with something like MEMORY_MANAGEMENT.'),B('Oyunda, Excel\'de rastgele donup mavi ekran veriyor.','It freezes and blue-screens at random, in games and in Excel.')],
    hint:[B('Mavi ekranı gör. Teşhis USB\'n varsa MemTest86 çalıştır; yoksa RAM\'leri tek tek takıp dene.','See the blue screen. Run MemTest86 if you have the diagnostic USB, or test the sticks one at a time.'),B('Arızalı modülü bul, aynı tipte (DDR4/DDR3) yenisiyle değiştir.','Find the faulty stick and replace it with the same type (DDR4/DDR3).')],
    lesson:B('Arızalı RAM rastgele mavi ekrana ve bozuk dosyalara yol açar. Teknisyenler modülleri tek tek test eder. DDR3, DDR4 ve DDR5 birbirine uymaz; çentikleri farklıdır.','Bad RAM causes random blue screens and corrupted files. Techs test sticks one at a time. DDR3, DDR4 and DDR5 don\'t fit each other; the notches differ.')},
  ssd_dead:{day:2,w:2,labor:()=>9,setup:l=>{const d=l.st.m2||l.st.bay;d.ok=false;},
    say:[B('Açılışta "No bootable device" yazıyor. Dün akşam birden dondu, sonra bu.','It says "No bootable device" on startup. It froze last night and now this.'),B('Windows açılmıyor, siyah ekranda bir yazı çıkıyor.','Windows won\'t load, just some text on a black screen.')],
    hint:[B('BIOS\'a (F2) gir: disk listede görünüyor mu?','Enter the BIOS (F2): is the drive listed?'),B('Arızalı diski çıkar, uygun yeni disk tak, F12 menüsünden Windows kur.','Remove the dead drive, fit a compatible new one, install Windows from the F12 menu.')],
    lesson:B('BIOS diski hiç görmüyorsa disk ölmüştür ya da bağlantısı kopmuştur. NVMe ve SATA M.2 diskler benzer görünür ama farklı çentiklidir. Ölen SSD\'den veri kurtarmak çoğunlukla mümkün değildir: yedek önemli.','If the BIOS can\'t see the drive, it\'s dead or disconnected. NVMe and SATA M.2 drives look alike but are keyed differently. Data from a dead SSD is usually gone: backups matter.')},

function makeCustomer(fk,mk,over){

function retailCustomer(){
  const items=Object.keys(PARTS).filter(k=>PARTS[k].retail);

function randomCustomer(){
  if(has('vitrin')&&Math.random()<.4)return retailCustomer();
  const pool=[];for(const k in FAULTS){const f=FAULTS[k];if(S.day>=f.day)for(let i=0;i<f.w;i++)pool.push(k);}
  return makeCustomer(pick(pool));
}
function genArrivals(from){
  let n=2+Math.floor(S.rep-2)+(has('sign')?1:0)+(has('vitrin')?1:0)+(S.day>=3?1:0);n=clamp(n,1,7);
  const a=[];const start=Math.max(from,9*60+30);
  for(let i=0;i<n;i++)a.push(Math.round(R(start,17*60+40)));
  return a.filter(x=>x<CLOSE-60).sort((x,y)=>x-y);
}

let AC=null,master=null,musBus=null,fanSrc=null;
function ac(){
  if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=PREF.vol;master.connect(AC.destination);musBus=AC.createGain();musBus.gain.value=PREF.music?.5:0;musBus.connect(master);}catch(e){AC=null;}}
  if(AC&&AC.state==='suspended')AC.resume();return AC;
}
function tone(f,d,type,v,t0,dest){const a=ac();if(!a)return;if(!dest&&!PREF.sfx)return;t0=t0||0;const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.value=f;const st=a.currentTime+t0;g.gain.setValueAtTime(.0001,st);g.gain.linearRampToValueAtTime(v||.12,st+.008);g.gain.exponentialRampToValueAtTime(.0001,st+d);o.connect(g).connect(dest||master);o.start(st);o.stop(st+d+.05);}
let NB=null;function noiseBuf(a){if(!NB){NB=a.createBuffer(1,a.sampleRate*2,a.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}return NB;}
function noise(d,v,fc,t0,dest,q){const a=ac();if(!a)return;if(!dest&&!PREF.sfx)return;t0=t0||0;const s=a.createBufferSource();s.buffer=noiseBuf(a);const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=fc||2000;if(q)f.Q.value=q;const g=a.createGain();const st=a.currentTime+t0;g.gain.setValueAtTime(v||.2,st);g.gain.exponentialRampToValueAtTime(.0001,st+d);s.connect(f).connect(g).connect(dest||master);s.start(st,Math.random());s.stop(st+d+.05);}
function sfx(k){switch(k){
  case 'screw':tone(2400,.04,'square',.04);tone(1700,.05,'square',.04,.07);tone(1300,.05,'square',.04,.14);break;
  case 'snap':noise(.07,.35,3200);noise(.05,.3,2500,.12);break;
  case 'bell':tone(1318,.7,'sine',.13);tone(1046,1,'sine',.11,.2);tone(2637,.4,'sine',.03);break;
  case 'cash':noise(.08,.3,4000);tone(1567,.15,'triangle',.14,.05);tone(2093,.6,'triangle',.14,.17);noise(.25,.1,6000,.1);break;
  case 'drawer':noise(.25,.2,700);tone(220,.1,'square',.05,.2);break;
  case 'print':for(let i=0;i<12;i++)noise(.06,.12,2400+(i%2)*600,i*.12,null,6);break;
  case 'deliver':tone(784,.18,'sine',.12);tone(988,.18,'sine',.12,.18);tone(1175,.35,'sine',.12,.36);break;
  case 'ach':[523,659,784,1046].forEach((f,i)=>tone(f,.3,'triangle',.08,i*.09));break;
  case 'err':tone(150,.25,'sawtooth',.1);break;
  case 'zap':noise(.35,.5,6000);tone(80,.5,'sawtooth',.2);break;
  case 'click':tone(700,.03,'square',.05);break;
  case 'brush':noise(.7,.12,1400);noise(.5,.08,900,.4);break;
  case 'air':noise(1.2,.25,3500);break;
  case 'ok':tone(880,.12,'sine',.1);tone(1320,.25,'sine',.1,.12);break;
  case 'door':tone(1318,.5,'sine',.1);tone(988,.8,'sine',.1,.25);break;
}}

const MUS={timer:null,step:0,next:0,mode:'shop'};
const CH=[[220,261.6,329.6,392],[174.6,220,261.6,329.6],[261.6,329.6,392,493.9],[196,246.9,293.7,329.6]];
const BASS=[110,87.3,130.8,98];
const PENTA=[440,523.3,587.3,659.3,784,880,1046.5];
function musicStart(mode){const a=ac();if(!a||!S||!S.tut.on)return;if(musBus)musBus.gain.setValueAtTime(PREF.music?.5:0,a.currentTime);MUS.mode=mode;if(MUS.timer)return;MUS.next=a.currentTime+.15;MUS.step=0;MUS.timer=setInterval(musTick,90);}
function musicStop(){if(!MUS.timer)return;const tm=MUS.timer;MUS.timer=null;if(musBus&&AC){musBus.gain.setTargetAtTime(0,AC.currentTime,.6);}setTimeout(()=>{clearInterval(tm);if(musBus&&AC&&!MUS.timer)musBus.gain.setValueAtTime(PREF.music?.5:0,AC.currentTime);},2500);}
function musicApply(){if(musBus&&AC)musBus.gain.setTargetAtTime(PREF.music?.5:0,AC.currentTime,.3);}
function musTick(){
  const a=AC;if(!a)return;const e=60/(MUS.mode==='title'?64:78)/2;
  while(MUS.next<a.currentTime+.3){
    const s=MUS.step,c=Math.floor(s/16)%4,k=s%16,tt=MUS.next-a.currentTime;
    if(PREF.music){
      if(k===0)CH[c].forEach((f,i)=>{pad(f,e*16,tt,i);});
      if(MUS.mode!=='title'){
        if(k%8===0)kick(tt);
        if(k%8===4)noise(.18,.08,1800,tt,musBus,1.2);
        if(k%2===1)noise(.04,.03,8000,tt,musBus,3);
        if(k===0||k===6||k===10)tone(BASS[c]*(k===6?1.5:1),e*2.2,'sine',.16,tt,musBus);
        if(Math.random()<.22&&k%2===0)tone(pick(PENTA),e*1.6,'triangle',.05,tt,musBus);
      }else if(Math.random()<.12)tone(pick(PENTA),e*3,'sine',.05,tt,musBus);
    }
    MUS.next+=e;MUS.step++;
  }
}
function pad(f,d,t0,i){const a=AC;const o=a.createOscillator(),o2=a.createOscillator(),g=a.createGain(),lp=a.createBiquadFilter();lp.type='lowpass';lp.frequency.value=900;o.type='triangle';o2.type='sine';o.frequency.value=f;o2.frequency.value=f*1.004;const st=a.currentTime+t0;g.gain.setValueAtTime(.0001,st);g.gain.linearRampToValueAtTime(.035,st+.8);g.gain.linearRampToValueAtTime(.0001,st+d);o.connect(lp);o2.connect(lp);lp.connect(g).connect(musBus);o.start(st);o2.start(st);o.stop(st+d+.1);o2.stop(st+d+.1);}
function kick(t0){const a=AC;const o=a.createOscillator(),g=a.createGain();const st=a.currentTime+t0;o.frequency.setValueAtTime(120,st);o.frequency.exponentialRampToValueAtTime(45,st+.15);g.gain.setValueAtTime(.25,st);g.gain.exponentialRampToValueAtTime(.0001,st+.25);o.connect(g).connect(musBus);o.start(st);o.stop(st+.3);}

function spend(min){
  if(!min)return;
  if(has('driver')&&ui._screwing)min=min/2;
  S.time=Math.round((S.time+min)*10)/10;
  for(const j of S.jobs){const l=j.l,st=l.st;if(powerSrc(l)==='ac'&&st.batConn&&st.bat&&st.bat.ok&&!st.bat.swollen&&st.bat.health>=45)st.bat.charge=Math.min(100,st.bat.charge+min*.9);}
  while(S.arrivals.length&&S.arrivals[0]<=S.time){
    S.arrivals.shift();
    if(S.queue.length<(has('tv')?5:3)){S.queue.push(randomCustomer());toast(B('Kapı zili çaldı: tezgahta yeni müşteri var.','The door chime rang: a new customer at the counter.'),'door');sfx('door');}
  }
  for(const o of S.orders)if(o.at!=null&&o.day===S.day&&o.at<=S.time)deliver(o);

/* ---------- power & boot ---------- */
function later(ms,fn){const tok=RT.tok;const id=S.benchId;setTimeout(()=>{if(tok===RT.tok&&S&&S.benchId===id&&L()&&L().st.powered){fn();render();}},ms);}
function hardOff(msg){const l=L();if(!l)return;l.st.powered=false;l.st.screen='off';l.st.app=null;RT.tok++;fanSound(false);if(msg)note(msg,'w');}
function powerOn(){
  const l=L(),st=l.st,M=MODELS[l.model];spend(1);sfx('click');
  const src=powerSrc(l);
  if(!src||st.dead){
    let m=B('Güç düğmesine bastın: hiçbir ışık yanmadı, fan dönmedi.','You pressed power: no lights, no fan.');
    if(st.plug==='cust'&&!l.charger.ok)m=B(m.tr+' Adaptör takılıyken bile şarj ışığı sönük.',m.en+' Even with the charger in, the charge light stays off.');
    else if(!st.plug&&st.bat&&st.batConn&&st.bat.charge<=3)m=B(m.tr+' Batarya tamamen boş görünüyor.',m.en+' The battery seems completely empty.');
    if(!st.plug&&!st.batConn)m=B(m.tr+' Batarya bağlı değil ve adaptör takılı değil.',m.en+' The battery is disconnected and no charger is plugged in.');
    note(m);return;
  }
  if(src==='flaky'){note(B('Güç ışığı bir yandı bir söndü; fişi oynatınca güç gelip gidiyor.','The power light blinked on and off; power comes and goes when the plug moves.'),'w');found('dcjack');sfx('err');return;}
  st.powered=true;st.screen='post';st.app=null;RT.tok++;fanSound(true);
  later(1000,()=>{
    if(!st.hs){hardOff(B('Birkaç saniye içinde kapandı! Soğutucu takılı değilken işlemci anında 100°C\'ye çıkar.','It cut out within seconds! Without the heatsink the CPU hits 100°C instantly.'));sfx('err');return;}
    const sticks=st.ram.filter(r=>r&&r.seated);
    if(!sticks.length){st.screen='beep';beeps(3);note(B('Fan döndü, güç ışığı yandı ama ekran siyah. 3 uzun bip: bellek (RAM) bulunamadı.','Fan spins, power light on, but the screen stays black. 3 long beeps: no memory (RAM) detected.'),'w');found('ram_loose');return;}
    if(st.cmosV<2.5){st.screen='cmos';note(B('Ekranda "CMOS Checksum Error" ve tarih 01.01.2009, F1 ile devam istiyor.','The screen shows "CMOS Checksum Error", date 01/01/2009, press F1 to continue.'),'w');found('cmos');return;}
    contBoot();
  });
}
function contBoot(){
  const l=L(),st=l.st,M=MODELS[l.model];const sw=st.sw||{};st.screen='logo';bootJingle(M.boot);
  later(1500,()=>{
    const d=bootDrive(l);
    if(!d){st.screen='noboot';note(B('"No bootable device": Windows yüklü çalışan bir disk bulunamadı.','"No bootable device": no working drive with Windows found.'),'w');if([st.m2,st.bay].some(x=>x&&!x.ok))found('ssd_dead');return;}
    if(d.smart){st.screen='loading';note(B('Windows çok yavaş açıldı (yaklaşık 4 dakika). Diskten tık tık sesi geliyor.','Windows took about 4 minutes to load. The drive is clicking.'),'w');found('hdd_slow');spend(4);later(2600,()=>{st.screen='win';winChime();});return;}
    if(sw.corrupt){st.screen='autorepair';note(B('"Otomatik Onarım hazırlanıyor", sonra "Bilgisayarınız düzgün başlatılamadı". Yeniden başlatınca hep aynı döngü.','"Preparing Automatic Repair", then "Your PC did not start correctly". Restarting repeats the loop.'),'w');found('bootloop');return;}
    st.screen='load2';if(sw.bloat){spend(3);note(B('Windows açıldı ama masaüstü 3 dakika donuk kaldı, sağ altta onlarca simge belirdi.','Windows loaded, but the desktop froze for 3 minutes while dozens of tray icons appeared.'),'w');}
    later(sw.bloat?1800:800,()=>{st.screen='win';if(!sw.driver)winChime();
      if(sw.virus){note(B('Masaüstü açılır açılmaz reklam pencereleri fırladı. Tarayıcı ana sayfası değişmiş.','Ad windows popped up as soon as the desktop appeared. The browser homepage was hijacked.'),'w');found('virus');}
      if(sw.driver)note(B('Windows açıldı ama açılış sesi gelmedi, ekran çözünürlüğü de düşük.','Windows loaded, but there was no startup sound and the resolution is low.'),'w');
      if(ramBad(l)&&Math.random()<.35)bsod();});
  });
}
function bsod(){const l=L();l.st.screen='bsod';l.st.app=null;note(B('Mavi ekran: MEMORY_MANAGEMENT. Bellek hatası şüphesi.','Blue screen: MEMORY_MANAGEMENT. Suspect memory.'),'w');found('ram_bad');sfx('err');}

function fits(slot,pid){const l=L(),M=MODELS[l.model],P=PARTS[pid];
  if(slot.startsWith('ram'))return P.cat==='ram'?(P.ram===M.ram?true:t('Uyumsuz: '+P.ram.toUpperCase()+' modül '+M.ram.toUpperCase()+' yuvaya girmez','Won\'t fit: '+P.ram.toUpperCase()+' in a '+M.ram.toUpperCase()+' slot')):false;
  if(slot==='m2')return P.cat==='disk'?(P.form==='nvme'?true:t('Uyumsuz: bu yuva M.2 NVMe ister','Won\'t fit: this slot takes M.2 NVMe')):false;
  if(slot==='bay')return P.cat==='disk'?(P.form==='bay'?true:t('Uyumsuz: 2.5" yuvaya M.2 disk girmez','Won\'t fit: an M.2 drive can\'t go in a 2.5" bay')):false;
  if(slot==='bat')return P.cat==='batarya'?(P.model===l.model?true:t('Uyumsuz: başka modelin bataryası','Won\'t fit: battery for another model')):false;

function openPicker(slot){

  ui.sheet={k:'pick',slot,opts};render();
}
function installItem(slot,src,ref){

function runStress(){
  const l=L(),st=l.st;spend(10);
  const T=stressTemp(l);const tok=RT.tok;const t0=performance.now();const dur=3200;const top=Math.min(T,99);const bad=ramBad(l);
  const step=()=>{if(tok!==RT.tok)return;const p=Math.min(1,(performance.now()-t0)/dur);const v=Math.round(48+(top-48)*(1-Math.pow(1-p,2)));
    const el=$('#stressVal');if(el){el.textContent=v+'°C';el.style.color=v>=95?'#c62828':v>=85?'#b26a00':'#1e7a46';}
    const bar=$('#stressBar');if(bar)bar.style.width=Math.min(100,v)+'%';
    if(bad&&p>.45){bsod();render();return;}
    if(p<1)requestAnimationFrame(step);
    else{
      if(T>=97){hardOff(B('Stres testinde sıcaklık '+top+'°C\'ye çıktı ve bilgisayar aniden kapandı (termal kapanma).','Under stress the temperature reached '+top+'°C and the laptop cut out (thermal shutdown).'));found(st.fan.ok?'overheat':'fan_dead');sfx('err');}
      else{l.lastStress=T;note(B('Stres testi tamam: en yüksek '+T+'°C, kapanma yok.'+(T>88?' Yine de yüksek.':' Gayet iyi.'),'Stress test done: peak '+T+'°C, no shutdown.'+(T>88?' Still high.':' Looks good.')));if(!st.fan.ok)found('fan_dead');}
      render();}
  };requestAnimationFrame(step);
}

/* =================== jobs =================== */
function acceptJob(){
  const c=S.queue[0];if(!c||c.retail)return;
  if(S.jobs.length>=shelfCap()){toast(B('Raf dolu! Önce bir işi teslim et ya da raf genişlet.','The shelf is full! Deliver a job or buy another shelf.'));return;}
  S.queue.shift();
  const j={id:c.id,cust:{name:c.name,role:c.role,hair:c.hair,shirt:c.shirt},say:c.say,faults:c.faults,l:c.l,due:S.day+2,tut:!!c.tut};
  j.l.log.push({t:B('Müşteri şikâyeti: "'+c.say.tr+'"','Customer complaint: "'+c.say.en+'"'),time:hhmm(S.time),k:'c'});
  S.jobs.push(j);if(!S.benchId)S.benchId=j.id;
  spend(3);toast(B(j.cust.name+' laptopunu bıraktı.',j.cust.name+' left the laptop with you.'));render();
}
function declineJob(){const c=S.queue.shift();if(c){toast(B(c.name+' başka dükkana gitti.',c.name+' went to another shop.'));spend(2);}render();}
function toBench(id){const cj=cur();if(cj&&cj.l.st.powered){toast(B('Masadaki laptopu önce kapat.','Turn off the laptop on the bench first.'));return;}if(cj)cj.l.st.plug=null;S.benchId=id;ui.view='bench';spend(1);render();}
function toShelf(){const j=cur();if(!j)return;if(j.l.st.powered){toast(B('Önce bilgisayarı kapat.','Turn it off first.'));return;}j.l.st.plug=null;S.benchId=null;render();}
function sugLabor(j){return j.faults.reduce((s,f)=>s+FAULTS[f].labor(j.l),0);}
function callCust(id){
  const j=job(id);if(!j)return;if(j.l.st.powered){toast(B('Teslimden önce bilgisayarı kapat.','Turn the laptop off before handing it back.'));return;}
  if(!canWork())return;spend(15);
  const P=problems(j.l);
  if(P.length){repAdd(-.15);sfx('err');openModal({k:'complain',id,p:P[0]});return;}
  sfx('door');openModal({k:'invoice',id,labor:sugLabor(j)});
}
function invoiceLines(j){
  const st=j.l.st,lines=[];
  [...st.ram,st.m2,st.bay,st.bat].filter(x=>x&&x.owner==='shop').forEach(x=>lines.push({n:PARTS[x.pid].n,p:sp(x.pid)}));
  j.l.billed.forEach(b=>lines.push(b));return lines;
}
function printInvoice(id,labor){
  const j=job(id);const lines=invoiceLines(j);const parts=lines.reduce((s,x)=>s+x.p,0);
  S.invNo++;sfx('print');
  ui.modal={k:'receipt',inv:{no:S.invNo,id,kind:'job',name:j.cust.name,model:MODELS[j.l.model].name,lines,labor,total:parts+labor,day:S.day,time:hhmm(S.time)}};render();
}
function sellRetail(){
  const c=S.queue[0];if(!c||!c.retail||!stock(c.want))return;
  S.invNo++;sfx('print');
  ui.modal={k:'receipt',inv:{no:S.invNo,kind:'retail',name:c.name,lines:[{n:PARTS[c.want].n,p:sp(c.want)}],labor:0,total:sp(c.want),day:S.day,time:hhmm(S.time),pid:c.want}};render();

function takePayment(){
  const inv=ui.modal.inv;if(inv.paid)return;inv.paid=true;
  const reg=document.querySelector('.regBig .register');if(reg)reg.classList.add('open');
  const st=document.querySelector('.paper .stamp');if(st)st.classList.add('on');
  sfx('drawer');setTimeout(()=>sfx('cash'),180);
  setTimeout(()=>finishSale(inv),950);
}
function finishSale(inv){
  if(inv.kind==='retail'){
    S.queue.shift();S.stock[inv.pid]--;S.stats.sold++;earn(inv.total,B('Satış: '+PARTS[inv.pid].n.tr,'Sale: '+PARTS[inv.pid].n.en));repAdd(.02);spend(3);ach('retail');
    ui.modal={k:'msg',title:B('Satış tamam','Sale complete'),body:B(inv.name+' teşekkür edip çıktı. Kasaya '+usd(inv.total)+' girdi.',inv.name+' thanked you and left. '+usd(inv.total)+' in the till.')};render();return;
  }
  const j=job(inv.id);const parts=inv.total-inv.labor;
  const fair=sugLabor(j)+parts;const tol=has('light')?1.12:1;const ratio=inv.total/(fair*tol);
  let msg,dr,stars;
  if(ratio<=.9){dr=.25;stars=5;msg=B('Çok memnun kaldı, çevresine seni anlatacak.','Delighted. They\'ll tell everyone about you.');}
  else if(ratio<=1.1){dr=.15;stars=5;msg=B('Memnun kaldı, teşekkür etti.','Happy and grateful.');}
  else if(ratio<=1.3){dr=.03;stars=4;msg=B('Biraz pahalı buldu ama ödedi.','Found it a bit pricey but paid.');}
  else if(ratio<=1.6){dr=-.12;stars=2;msg=B('Pahalı buldu, söylene söylene ödedi.','Thought it was expensive and grumbled while paying.');}
  else{dr=-.3;stars=1;msg=B('Kazıklandığını düşünüyor. Yorumlara yazacakmış.','Feels ripped off and is going to post a review.');}
  if(ratio<=1.1){S.stats.fair++;if(S.stats.fair>=5)ach('honest');}
  if(j.l.st.clip){dr-=.08;stars=Math.max(1,stars-1);msg=B(msg.tr+' Kapaktaki kırık klipsi fark etti.',msg.en+' They noticed the broken clip on the cover.');}
  if(j.l.wiped){dr-=.2;stars=Math.max(1,stars-2);msg=B(msg.tr+' Bütün dosyaları silinmiş, çok üzüldü!',msg.en+' All their files were wiped and they\'re upset!');}
  if(has('coffee'))dr+=.02;
  if(S.day>j.due){dr-=.1;stars=Math.max(1,stars-1);msg=B(msg.tr+' Geç teslime söylendi.',msg.en+' They complained about the delay.');}
  let tip=0;if(stars===5&&Math.random()<.35)tip=RI(1,4);
  repAdd(dr);earn(inv.total,B('Tamir: '+j.cust.name+' · '+inv.model,'Repair: '+j.cust.name+' · '+inv.model));if(tip)earn(tip,B('Bahşiş','Tip'));
  S.stats.fixed++;if(S.stats.fixed===1)ach('first');if(S.stats.fixed===5)ach('five');if(S.stats.fixed===10)ach('ten');
  S.reviews.unshift({name:j.cust.name,stars,day:S.day,txt:REVIEWS[stars]});if(S.reviews.length>20)S.reviews.length=20;
  for(const it of j.l.tray)if(it.owner==='shop')S.stock[it.pid]=(S.stock[it.pid]||0)+1;
  S.jobs=S.jobs.filter(x=>x!==j);if(S.benchId===inv.id)S.benchId=null;
  RT.tok++;fanSound(false);
  ui.modal={k:'paid',total:inv.total,tip,msg,dr,stars,faults:j.faults,name:j.cust.name};render();
}
const REVIEWS={5:B('Hızlı ve dürüst. Sorunu tek seferde çözdü.','Fast and honest. Fixed it in one go.'),4:B('İşini biliyor, fiyat biraz yüksek.','Knows the job, a bit pricey.'),2:B('Tamir oldu ama fiyat fazlaydı.','It got fixed but the price was steep.'),1:B('Kazık! Tavsiye etmem.','Rip-off! Wouldn\'t recommend.')};

/* =================== ordering & shop =================== */
function buy(pid,express){
  if(!canWork())return;
  const P=PARTS[pid];const cost=Math.round(P.c*(express?(has('cabinet')?1.15:1.35):1));
  if(S.money<cost){toast(B('Kasada yeterli para yok.','Not enough cash in the till.'));return;}
  pay(cost,B('Sipariş: '+P.n.tr,'Order: '+P.n.en));
  const o={pid,q:1,day:express?S.day:S.day+1,at:express?S.time+90:null};
  if(express&&o.at>=CLOSE){o.day=S.day+1;o.at=null;}
  S.orders.push(o);toast(express?B('Ekspres kurye yola çıktı (~90 dk).','Express courier on the way (~90 min).'):B('Sipariş verildi, yarın sabah gelir.','Ordered. It arrives tomorrow morning.'));render();
}
function buyTool(k){const T=TOOLS[k];if(has(k))return;if(S.money<T.c){toast(B('Kasada yeterli para yok.','Not enough cash in the till.'));return;}pay(T.c,B('Alet: '+T.n.tr,'Tool: '+T.n.en));S.tools[k]=1;sfx('cash');toast(B(T.n.tr+' alındı.',T.n.en+' purchased.'));
  if(k==='vitrin'){S.arrivals.push(Math.min(S.time+40,CLOSE-70));S.arrivals.sort((a,b)=>a-b);}
  render();}

/* =================== day cycle =================== */
function endDay(){
  pay(RENT,B('Kira ve faturalar','Rent and bills'));
  let late=0;for(const j of S.jobs)if(S.day>=j.due)late++;
  if(late)repAdd((has('coffee')?-.05:-.1)*late);
  const sum={day:S.day,inc:S.today.inc,exp:S.today.exp,rent:RENT,late,left:S.queue.length,money:S.money};
  S.queue=[];S.day++;S.time=9*60;S.today={inc:0,exp:0};ui.closing=false;
  if(S.day>=5)ach('day5');
  const pend=S.orders.filter(o=>!o.done);
  for(const o of pend)if(o.at==null&&o.day<=S.day)deliver(o);
  for(const o of pend)if(!o.done&&o.at!=null)deliver(o);
  S.orders=S.orders.filter(o=>!o.done);
  S.arrivals=genArrivals(9*60);
  for(const j of S.jobs){j.l.st.powered=false;j.l.st.screen='off';j.l.st.plug=null;}
  RT.tok++;fanSound(false);
  openModal({k:'summary',sum});
}

function bootLogo(M,withBar){

function screen(l){
  const st=l.st,M=MODELS[l.model];if(!st.powered)return '';
  switch(st.screen){
    case 'post':case 'beep':return '';
    case 'logo':return bootLogo(M);
    case 'load2':return `<div class="s-post"><div><div style="font-family:var(--f-body)">Windows</div><div class="dots"><i></i><i></i><i></i></div></div></div>`;
    case 'loading':return `<div class="s-post"><div><div style="font-family:var(--f-body)">${t('Hazırlanıyor…','Getting ready…')}</div><div class="dots"><i></i><i></i><i></i></div><div style="font-size:.8em;color:#999;margin-top:6px">${t('(disk ışığı sürekli yanıyor)','(the disk light never stops)')}</div></div></div>`;
    case 'cmos':return `<div class="s-text">CMOS Checksum Error - Defaults loaded\nDate/Time not set: 01/01/2009 00:00\n\nPress F1 to continue, F2 to enter SETUP</div>`;
    case 'noboot':return `<div class="s-text">No bootable device -- insert boot disk and press any key</div>`;
    case 'bsod':return `<div class="s-bsod"><b>:(</b><p style="margin-top:6%">${t('Bilgisayarınız bir sorunla karşılaştı ve yeniden başlatılması gerekiyor.','Your PC ran into a problem and needs to restart.')}</p><p style="margin-top:4%;font-size:.85em">Stop code: MEMORY_MANAGEMENT</p></div>`;
    case 'autorepair':return `<div class="s-bsod" style="background:#0b5cad"><p style="font-size:1.2em">${t('Bilgisayarınız düzgün başlatılamadı','Your PC did not start correctly')}</p><p style="margin-top:5%;font-size:.85em">${t('Otomatik Onarım bilgisayarınızı onaramadı. Yeniden başlatın ya da gelişmiş seçenekleri deneyin.','Automatic Repair couldn\'t repair your PC. Restart, or try advanced options.')}</p><p style="margin-top:5%;font-size:.8em;opacity:.7">Log: SrtTrail.txt</p></div>`;
    case 'bios':return biosScreen(l);
    case 'boot':return bootMenu(l);
    case 'memtest':return `<div class="s-text" style="background:#00007a;color:#fff">MemTest86 v10\n${esc(X(st.memRes))}</div>`;
    case 'setup':return `<div class="s-text" style="background:#1f3f7a">${esc(X(st.setupMsg))}</div>`;
    case 'win':return winScreen(l);
  }
  return '';
}

  const bw=M.bay?55:86;

  if(st.bat)h+=cp('batcon',4+bw/2-4,58,8,5,`<div class="batc ${st.batConn?'':'off'}"></div>`,t('Konnektör','Connector'),'z-index:2');

}
